name: cade-o-meu-dinheiro

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5101:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:5101
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: comd
      DB_USERNAME: comd
      DB_PASSWORD: comd
    depends_on:
      database:
        condition: service_healthy

  vite:
    image: node:26-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5102:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEV_SERVER_URL: http://localhost:5102
    volumes:
      - ..:/var/www/html
      - node_modules:/var/www/html/node_modules

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ["e2e"]
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run test:e2e"
    environment:
      PLAYWRIGHT_BASE_URL: http://app:8000
    volumes:
      - ..:/var/www/html
      - playwright_node_modules:/var/www/html/node_modules
    depends_on:
      app:
        condition: service_started
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: comd
      POSTGRES_USER: comd
      POSTGRES_PASSWORD: comd
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comd -d comd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  playwright_node_modules:
  postgres_data:
