name: cade-o-meu-dinheiro

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-verde_financas}
      DB_USERNAME: ${POSTGRES_USER:-verde}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_NINJAS_API_KEY: ${API_NINJAS_API_KEY}
      API_NINJAS_BIN_URL: ${API_NINJAS_BIN_URL:-https://api.api-ninjas.com/v2/bin}
      API_NINJAS_MONTHLY_LIMIT: ${API_NINJAS_MONTHLY_LIMIT:-9500}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: app
    command: php artisan schedule:work
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${APP_DOMAIN}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-verde_financas}
      DB_USERNAME: ${POSTGRES_USER:-verde}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_NINJAS_API_KEY: ${API_NINJAS_API_KEY}
      API_NINJAS_BIN_URL: ${API_NINJAS_BIN_URL:-https://api.api-ninjas.com/v2/bin}
      API_NINJAS_MONTHLY_LIMIT: ${API_NINJAS_MONTHLY_LIMIT:-9500}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: web
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.cade-o-meu-dinheiro.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.cade-o-meu-dinheiro.entrypoints=websecure
      - traefik.http.routers.cade-o-meu-dinheiro.tls=true
      - traefik.http.routers.cade-o-meu-dinheiro.tls.certresolver=letsencrypt
      - traefik.http.services.cade-o-meu-dinheiro.loadbalancer.server.port=80

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verde_financas}
      POSTGRES_USER: ${POSTGRES_USER:-verde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
  proxy:
    external: true
